<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Rooms, workshops and storage to let at The Old Mill, Mill Lane, Kineton.">
<title>The Old Mill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1d5a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Old Mill">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <img src="img/logo-96.png" alt="" width="40" height="40">
      <span id="brand-name">The Old Mill</span>
    </div>
    <div class="row" style="gap:10px">
    <button type="button" id="install-btn" class="btn primary sm" data-act="get-app" aria-label="Install app" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      <span class="install-text">Install app</span></button>
    <nav class="seg" aria-label="View">
      <button type="button" data-view="site" aria-pressed="true">Website</button>
      <button type="button" data-view="tenant" aria-pressed="false">Tenant portal</button>
      <button type="button" data-view="landlord" aria-pressed="false" hidden>Landlord</button>
    </nav>
    </div>
  </div>
  <div id="tierbar" hidden></div>
</header>
<div class="banner" id="banner" hidden></div>
<main id="app"></main>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
